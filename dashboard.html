<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD_TERMINAL</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Додаткові стилі для сітки 3x3 */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace; /* Щоб шрифт був всюди */
        }

        .dashboard-header {
            border-bottom: 2px solid #333;
            padding-bottom: 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            padding: 15px;
            border: 2px solid #333;
            margin-bottom: 30px;
        }

        .resources-grid {
            display: grid;
            /* ЖОРСТКА СІТКА 3 НА 3 */
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; /* Менший відступ, щоб виглядало щільніше */
            margin-bottom: 40px;
        }

        .resource-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px; /* Мінімальна висота для карток */
        }

        .resource-card:hover {
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            transform: scale(1.02); /* Легкий ефект масштабування */
        }

        .resource-card.selected {
            border-color: #00ff41;
            /* Брутальний зелений фон */
            background: rgba(0, 255, 65, 0.08); 
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        .resource-card.selected::before {
            content: "[ACTIVE]";
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            color: #00ff41;
            font-weight: bold;
        }

        .resource-title {
            color: #00ff41;
            font-size: 1.1em;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .resource-desc {
            color: #888;
            font-size: 0.8em;
            line-height: 1.4;
            flex-grow: 1; /* Опис заповнює простір */
        }

        .badge-count {
            color: #00ff41;
            background: rgba(0, 255, 65, 0.1);
            padding: 4px 10px;
            border: 1px solid #00ff41;
            font-weight: bold;
        }

        .logout-link {
            color: #ff4141;
            text-decoration: none;
            font-size: 0.85em;
            text-transform: uppercase;
        }
        
        .logout-link:hover { text-decoration: underline; color: #ff0000; }

        /* Фікс для кнопки в термінал стилі */
        .submit-btn {
            padding: 12px 24px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1 style="color: #00ff41; font-size: 1.6em; text-transform: uppercase; letter-spacing: 2px;">Main_Control_Panel</h1>
                <p class="status">Operator: <span id="userName" style="color: #fff;">...waiting_credentials</span></p>
            </div>
            <a href="#" class="logout-link" onclick="logout()">[LOGOUT]</a>
        </header>

        <div class="controls-bar">
            <div>Вибрано_ресурсів: <span id="selectedCount" class="badge-count">0</span></div>
            <button class="btn-primary submit-btn" id="submitBtn" onclick="submitSelection()" disabled>
                Execute_REQUEST_Form
            </button>
        </div>

        <div class="resources-grid" id="resourcesGrid">
            </div>
    </div>

    <script>
        const resources = [
            { id: 1, title: 'База_Аркан', desc: 'Витяг із зазначенням періоду перебування' },
            { id: 2, title: 'ДМС_України', desc: 'Державна міграційна служба' },
            { id: 3, title: 'Реєстр_нерухомості', desc: 'Державний реєстр речових прав' },
            { id: 4, title: 'НАІС ГСЦ МВС', desc: 'Головний сервісний центр МВС' },
            { id: 5, title: 'Витяг ІПНП', desc: 'Інформаційна підсистема' },
            { id: 6, title: 'YouControl', desc: 'Аналітична система перевірки' },
            { id: 7, title: 'РАЦС', desc: 'Акти цивільного стану' },
            { id: 8, title: 'Судові рішення', desc: 'Єдиний реєстр судових рішень' },
            { id: 9, title: 'Реєстр довіреностей', desc: 'Єдиний реєстр довіреностей' }
        ];

        let selectedResources = [];

        function loadResources() {
            const user = JSON.parse(localStorage.getItem('currentUser')) || { name: "OP_01_KYIV" };
            document.getElementById('userName').textContent = user.name || user.login;

            const grid = document.getElementById('resourcesGrid');
            resources.forEach(res => {
                const card = document.createElement('div');
                card.className = 'resource-card';
                card.id = `res-${res.id}`;
                card.onclick = () => toggleResource(res.id);
                
                card.innerHTML = `
                    <div class="resource-title">> ${res.title}</div>
                    <div class="resource-desc">${res.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleResource(id) {
            const card = document.getElementById(`res-${id}`);
            const index = selectedResources.indexOf(id);

            if (index === -1) {
                selectedResources.push(id);
                card.classList.add('selected');
            } else {
                selectedResources.splice(index, 1);
                card.classList.remove('selected');
            }

            document.getElementById('selectedCount').textContent = selectedResources.length;
            document.getElementById('submitBtn').disabled = selectedResources.length === 0;
        }

        function submitSelection() {
            sessionStorage.setItem('selectedResources', JSON.stringify(selectedResources));
            window.location.href = 'request-form.html';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        window.onload = loadResources;
    </script>
</body>
</html>
