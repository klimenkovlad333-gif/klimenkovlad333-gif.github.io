<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION_TERMINAL</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-container">
        <header class="auth-header">
            <h2>Створити_акаунт</h2>
            <p class="status">Статус: Реєстрація нового об'єкта...</p>
        </header>

        <form class="auth-form">
            <div class="input-group">
                <label>Прізвище</label>
                <input type="text" placeholder="Введіть прізвище..." required>
            </div>

            <div class="input-group">
                <label>Ім'я</label>
                <input type="text" placeholder="Введіть ім'я..." required>
            </div>

            <div class="input-group">
                <label>Номер_телефону</label>
                <input type="tel" placeholder="+380..." required>
            </div>
            
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Зареєструватися</button>
        </form>

        <footer class="auth-footer">
            <span>Вже є акаунт?</span>
            <a href="index.html">Увійти</a>
        </footer>
    </main>
</body>
</html>
