<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION_TERMINAL</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-container">
        <header class="auth-header">
            <h2>Реєстрація_об'єкта</h2>
            <p class="status" id="status-text">Статус: Очікування даних...</p>
        </header>

        <form class="auth-form" id="regForm">
            <div class="input-group">
                <label>Прізвище</label>
                <input type="text" id="lastName" placeholder="Введіть прізвище..." required>
            </div>
            <div class="input-group">
                <label>Ім'я</label>
                <input type="text" id="firstName" placeholder="Введіть ім'я..." required>
            </div>
            <div class="input-group">
                <label>Номер_телефону</label>
                <input type="tel" id="phone" placeholder="+380..." required>
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Записати_в_базу</button>
        </form>
    </main>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Зупиняємо стандартну відправку

            const status = document.getElementById('status-text');
            status.innerText = "Статус: Запис даних... Зачекайте.";
            status.style.color = "#00ff41";

            // Імітація запису в базу (тимчасово, поки не підключимо Firebase)
            setTimeout(() => {
                // Перенаправлення на головну сторінку
                window.location.href = "dashboard.html"; 
            }, 1500);
        });
    </script>
</body>
</html>
