<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | Klimenko Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <form id="registerForm" class="auth-form">
            <h2>Створити акаунт</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Логін" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn primary">Зареєструватися</button>
            <p class="auth-footer">Вже є акаунт? <a href="login.html">Увійти</a></p>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Зупиняємо перезавантаження сторінки
            
            const user = {
                login: document.getElementById('username').value,
                pass: document.getElementById('password').value
            };

            // Зберігаємо в пам'ять браузера (імітація БД)
            localStorage.setItem('registeredUser', JSON.stringify(user));
            
            alert('Реєстрація успішна! Переходимо до входу...');
            
            // Автоматичний редірект на сторінку входу
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
