<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REQUEST_FORM_SYSTEM</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .request-container {
            max-width: 800px;
            margin: 40px auto;
            background: #111;
            border: 1px solid #333;
            padding: 30px;
        }

        .section-title {
            color: #00ff41;
            border-bottom: 1px solid #00ff41;
            margin: 20px 0;
            padding-bottom: 5px;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .selected-resources-box {
            background: rgba(0, 255, 65, 0.05);
            border: 1px dashed #00ff41;
            padding: 15px;
            margin-bottom: 25px;
        }

        .resource-tag {
            display: inline-block;
            background: #00ff41;
            color: #000;
            padding: 2px 8px;
            margin: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .person-block {
            border: 1px solid #222;
            padding: 20px;
            margin-bottom: 20px;
            background: #0a0a0a;
        }

        .person-header {
            display: flex;
            justify-content: space-between;
            color: #888;
            margin-bottom: 15px;
            font-size: 0.8em;
        }

        .btn-add {
            background: none;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
            font-family: inherit;
        }

        .btn-add:hover { background: rgba(0, 255, 65, 0.1); }

        .btn-remove {
            color: #ff4141;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        input[type="date"] {
            background: #000;
            border: none;
            border-bottom: 1px solid #333;
            color: #00ff41;
            padding: 8px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="request-container">
        <header class="auth-header">
            <h2>FORM_DATA_ENTRY</h2>
            <p class="status">Введення параметрів для генерації запиту</p>
        </header>

        <div class="selected-resources-box">
            <div style="font-size: 10px; margin-bottom: 10px; color: #888;">АКТИВНІ_МОДУЛІ:</div>
            <div id="resourcesList"></div>
        </div>

        <form onsubmit="submitRequest(event)">
            <div class="section-title">01. Анкетні_дані_об'єктів</div>
            <button type="button" class="btn-add" onclick="addPerson()">[+] ДОДАТИ_ОБ'ЄКТ</button>
            <div id="personsContainer"></div>

            <div class="section-title">02. Юридична_підстава</div>
            <div class="input-group">
                <label>17-значний_код</label>
                <input type="text" id="groundCode" maxlength="17" placeholder="00000000000000000" required>
            </div>
            <div class="input-group">
                <label>Дата_підстави</label>
                <input type="date" id="groundDate" required>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 30px;">ВИКОНАТИ_ЗАПИС_В_БАЗУ</button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="dashboard.html" style="color: #444; text-decoration: none; font-size: 12px;">[ ПОВЕРНУТИСЯ_БЕЗ_ЗБЕРЕЖЕННЯ ]</a>
        </div>
    </div>

    <script>
        let personCount = 0;
        const resourceNames = { 1: 'Аркан', 2: 'ДМС', 3: 'Реєстр нерухомості', 4: 'НАІС', 5: 'ІПНП', 6: 'YouControl', 7: 'РАЦС', 8: 'Судові рішення', 9: 'Довіреності' };
        const resourceFields = {
            1: { fields: ['name', 'birthDate', 'passport'], labels: ['ПІБ', 'Дата народження', 'Закордонний паспорт'] },
            2: { fields: ['fullName', 'birthDate', 'rnkpo'], labels: ['ПІБ', 'Дата народження', 'РНКПО'] },
            3: { fields: ['fullName', 'ipn', 'address'], labels: ['ПІБ', 'ІПН', 'Адреса'] },
            4: { fields: ['carNumber', 'rnkpo'], labels: ['Держномер авто', 'РНКПО'] },
            5: { fields: ['freeText'], labels: ['Додаткова інформація'] },
            6: { fields: ['erdpo', 'toName'], labels: ['ЄРДПО', 'Назва ТОВ'] },
            7: { fields: ['fullName', 'rnkpo'], labels: ['ПІБ', 'РНКПО'] },
            8: { fields: ['fullName', 'birthDate'], labels: ['ПІБ', 'Дата народження'] },
            9: { fields: ['rnkpo'], labels: ['РНКПО'] }
        };

        function init() {
            const selected = JSON.parse(sessionStorage.getItem('selectedResources')) || [];
            if (selected.length === 0) { window.location.href = 'dashboard.html'; return; }

            const list = document.getElementById('resourcesList');
            selected.forEach(id => {
                const tag = document.createElement('span');
                tag.className = 'resource-tag';
                tag.textContent = resourceNames[id];
                list.appendChild(tag);
            });
            addPerson();
        }

        function addPerson() {
            personCount++;
            const container = document.getElementById('personsContainer');
            const div = document.createElement('div');
            div.className = 'person-block';
            div.id = `person-${personCount}`;

            const selected = JSON.parse(sessionStorage.getItem('selectedResources')) || [];
            let fieldsSet = new Set();
            let labelsMap = {};
            selected.forEach(id => {
                resourceFields[id].fields.forEach((f, i) => {
                    fieldsSet.add(f);
                    labelsMap[f] = resourceFields[id].labels[i];
                });
            });

            let fieldsHTML = `<div class="person-header"><span>ОБ'ЄКТ #${personCount}</span>${personCount > 1 ? `<button type="button" class="btn-remove" onclick="removePerson(${personCount})">[ВИДАЛИТИ]</button>` : ''}</div>`;
            fieldsSet.forEach(f => {
                fieldsHTML += `<div class="input-group"><label>${labelsMap[f]}</label><input type="text" name="p${personCount}_${f}" required></div>`;
            });

            div.innerHTML = fieldsHTML;
            container.appendChild(div);
        }

        function removePerson(id) { document.getElementById(`person-${id}`).remove(); }

        function submitRequest(e) {
            e.preventDefault();
            alert('СИСТЕМА: Запит сформовано та надіслано до черги обробки.');
            window.location.href = 'dashboard.html';
        }

        window.onload = init;
    </script>
</body>
</html>
