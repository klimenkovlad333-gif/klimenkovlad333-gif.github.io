<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTH_TERMINAL</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-container">
        <header class="auth-header">
            <h2>Доступ_до_системи</h2>
            <p class="status" id="status-text">Статус: Очікування даних...</p>
        </header>

        <form class="auth-form" id="loginForm">
            <div class="input-group">
                <label for="login">Ідентифікатор_користувача</label>
                <input type="text" id="login" placeholder="Введіть ID..." required>
            </div>
            
            <div class="input-group">
                <label for="password">Ключ_доступу</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Увійти_в_систему</button>
        </form>

        <footer class="auth-footer">
            <a href="register.html">Реєстрація</a>
        </footer>
    </main>

    <script>
        // Логіка обробки входу
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Зупиняємо перезавантаження сторінки

            const status = document.getElementById('status-text');
            status.innerText = "Статус: Перевірка ключа... Авторизація.";
            status.style.color = "#00ff41";

            // Імітуємо затримку для "солідності" процесу
            setTimeout(() => {
                // Перехід на сторінку дашборду
                window.location.href = "dashboard.html";
            }, 1200);
        });
    </script>
</body>
</html>
