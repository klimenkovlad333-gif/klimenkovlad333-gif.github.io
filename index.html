<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СРМ Система - Управління ресурсами</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .button {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            text-decoration: none;
            font-size: 16px;
            transition: background 0.3s;
            font-weight: 600;
        }
        
        .button:hover {
            background: #764ba2;
        }
        
        .button.secondary {
            background: #e0e7ff;
            color: #667eea;
        }
        
        .button.secondary:hover {
            background: #c7d2fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 СРМ Система</h1>
        <p>Управління ресурсами та підписками</p>
        
        <a href="register.html" class="button">📝 Реєстрація</a>
    </div>
</body>
</html>
